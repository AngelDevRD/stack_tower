name: Release

on:
  push:
    branches:
      - master
    paths:
      - "lib/**"
      - "android/**"
      - "assets/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "windows/**"
    tags:
      - "v*.*.*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.compute.outputs.tag }}
      name: ${{ steps.compute.outputs.name }}
      skip: ${{ steps.compute.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calcular tag y version del release
        id: compute
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git log -1 --pretty=%B | grep -qF '[skip release]'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Commit marcado con [skip release]: se omite el release."
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          else
            LATEST=$(gh release view --repo "${{ github.repository }}" --json tagName -q .tagName 2>/dev/null || true)
            if [ -z "$LATEST" ]; then
              TAG="v1.0.0"
            else
              TAG=$(node -e "
                const m = process.argv[1].replace(/^v/i, '').match(/^(\d+)\.(\d+)\.(\d+)/);
                console.log('v' + m[1] + '.' + m[2] + '.' + (Number(m[3]) + 1));
              " "$LATEST")
            fi
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "name=${TAG#v}" >> "$GITHUB_OUTPUT"

  verify-version:
    needs: version
    if: needs.version.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verificar que el tag es superior al ultimo release publicado
        run: node tools/verify-release-version.mjs --repo ${{ github.repository }} --new "${{ needs.version.outputs.tag }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-android:
    needs: [version, verify-version]
    if: needs.version.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.1"
          channel: "stable"

      - run: flutter pub get

      - run: flutter test

      - name: Restaurar keystore de firma release
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::Falta ANDROID_KEYSTORE_BASE64. Sin keystore la APK se firma con la clave debug, que cambia en cada runner, y Android rechaza instalarla sobre la version ya instalada."
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > android/app/release.jks
          cat > android/key.properties <<EOF
          storeFile=release.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      - run: >
          flutter build apk --release
          --build-name=${{ needs.version.outputs.name }}
          --build-number=${{ github.run_number }}

      - name: Renombrar artefacto
        run: cp build/app/outputs/flutter-apk/app-release.apk stack-tower-android.apk

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: stack-tower-android.apk

  build-windows:
    needs: [version, verify-version]
    if: needs.version.outputs.skip != 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.1"
          channel: "stable"

      - run: flutter config --enable-windows-desktop

      - run: flutter pub get

      - run: flutter build windows --release

      - name: Empaquetar build de Windows
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath stack-tower-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: stack-tower-windows.zip

  release:
    needs: [version, build-android, build-windows]
    if: needs.version.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4

      # Se usa gh (Go, preinstalado en el runner) en vez de softprops/action-gh-release:
      # con Node 24 por defecto en los runners esa accion aborta la subida de assets grandes
      # (~50 MB) a los ~28 s con "Headers Timeout Error", dejando el release en draft y vacio.
      - name: Publicar release con los assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft \
              --target "$GITHUB_SHA" --title "$TAG" --generate-notes
          fi
          for intento in 1 2 3; do
            if gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber \
              android-apk/stack-tower-android.apk \
              windows-zip/stack-tower-windows.zip; then
              break
            fi
            if [ "$intento" = 3 ]; then
              echo "::error::No se pudieron subir los assets tras 3 intentos."
              exit 1
            fi
            echo "Subida fallida (intento $intento); reintentando en 15 s..."
            sleep 15
          done
          # Se publica solo cuando el release ya tiene la APK: un draft a medias lo ignora
          # el portafolio, que sigue sirviendo la version anterior completa.
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
